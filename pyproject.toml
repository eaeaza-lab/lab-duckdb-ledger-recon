[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duckdb-ledger-recon"
version = "0.1.0"
description = "A local synthetic-ledger reconciliation lab"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "polars>=1.0", "typer>=0.12", "jinja2>=3.1"]

[project.scripts]
ledger-recon = "ledger_recon.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
